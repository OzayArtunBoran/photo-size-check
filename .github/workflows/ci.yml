name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # a hang should fail fast, not run for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-api.txt
      # The segmentation model (4.6 MB) is not in the repository: fetched once, checked against
      # its SHA-256 by ensure_model(), cached by that checksum.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/photosize
          key: u2netp-309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8
      - run: python -c "from photosize.segment_model import ensure_model; print(ensure_model())"
      - run: python -m mypy photosize evaluate.py tests scripts
      - run: python -m pytest -q
